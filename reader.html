<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Your E-Book | Kahani-Kahani Mein Vocabulary</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b1120;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh}.topbar{height:64px;background:#111827;border-bottom:1px solid #374151;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:5}.title{font-size:15px;font-weight:700}.status{font-size:12px;color:#34d399}.reader{max-width:900px;margin:auto;padding:14px 10px 90px}.page-wrap{position:relative;background:#fff;box-shadow:0 4px 24px #0008;min-height:300px}.page{display:block;width:100%;height:auto}.watermark{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#1118;font-size:12px;font-weight:700;pointer-events:none;user-select:none}.controls{position:fixed;left:0;right:0;bottom:0;background:#111827;border-top:1px solid #374151;padding:10px;display:flex;align-items:center;justify-content:center;gap:10px;z-index:6}.controls button{border:0;border-radius:8px;padding:10px 16px;background:#2563eb;color:white;font-weight:700}.controls button:disabled{opacity:.45}.counter{font-size:13px;color:#d1d5db;min-width:80px;text-align:center}.loading{text-align:center;padding:60px 20px;color:#d1d5db}.error{color:#f87171}.back{display:inline-block;margin-top:15px;color:white;background:#2563eb;padding:10px 15px;border-radius:8px;text-decoration:none}</style></head><body><div class="topbar"><div class="title">📚 Kahani-Kahani Mein 1000 Vocabulary</div><div class="status">✓ Paid Access</div></div><main class="reader"><div id="loading" class="loading">📖<br><br>Preparing your protected e-book...</div><div id="book" style="display:none"><div class="page-wrap"><img id="page" class="page" alt="E-book page"><div id="watermark" class="watermark"></div></div></div></main><div class="controls"><button id="prev">← Previous</button><div id="counter" class="counter">Page 1 / 101</div><button id="next">Next →</button></div><script>const API="https://kahani-kahani-mein-1000-vocabulary.vercel.app";let token=sessionStorage.getItem("ebook_access_token"),page=1,total=101,name="";function payload(){try{let p=JSON.parse(atob(token.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-token.split('.')[0].length%4)%4)));return p||{}}catch{return{}}}function msg(t){document.getElementById('loading').innerHTML='<span class="error">'+t+'</span><br><a class="back" href="index.html">← Back to Website</a>';document.getElementById('book').style.display='none';document.querySelector('.controls').style.display='none'}async function load(n){if(!token)return msg('Your e-book access session was not found. Please complete payment again.');document.getElementById('prev').disabled=n<=1;document.getElementById('next').disabled=n>=total;document.getElementById('counter').textContent='Page '+n+' / '+total;try{const r=await fetch(API+'/api/page',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:token,page:n})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Access expired or unavailable.')}const blob=await r.blob();const url=URL.createObjectURL(blob);const img=document.getElementById('page');const old=img.src;img.onload=()=>{if(old&&old.startsWith('blob:'))URL.revokeObjectURL(old)};img.src=url;page=n;document.getElementById('loading').style.display='none';document.getElementById('book').style.display='block'}catch(e){sessionStorage.removeItem('ebook_access_token');msg(e.message)}}document.getElementById('prev').onclick=()=>{if(page>1)load(page-1)};document.getElementById('next').onclick=()=>{if(page<total)load(page+1)};document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['s','p','u'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='ArrowLeft'&&page>1)load(page-1);if(e.key==='ArrowRight'&&page<total)load(page+1)});name=payload().name||'';document.getElementById('watermark').textContent=name?'Purchased by: '+name:'';load(1);</script></body></html>
